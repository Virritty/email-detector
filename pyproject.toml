[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-email-detector"
version = "0.1.0"
description = "Детектор ИИ-сгенерированного контента в email-письмах (.eml)"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "pandas",
    "numpy",
    "scikit-learn",
    "joblib",
    "beautifulsoup4",
    "Pillow",
    "matplotlib",
]

[tool.setuptools]
py-modules = [
    "main",
    "eml_parser",
    "text_detector",
    "html_detector",
    "image_detector",
    "train_detector",
    "download_data",
]
